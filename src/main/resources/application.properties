spring.application.name=todolist

# =============================================
# Configurações do Banco de Dados (MySQL) - use variáveis de ambiente
# =============================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/todoapi?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo}
spring.datasource.driverClassName=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# =============================================
# Configurações do JPA / Hibernate
# =============================================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate

# =============================================
# Configurações do Flyway (migrations)
# =============================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# =============================================
# JWT
# =============================================
# In production set JWT_SECRET env var. If unset, a temporary key will be generated at runtime (not secure for prod).
jwt.secret=${JWT_SECRET:}
