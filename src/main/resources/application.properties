spring.application.name=todolist

# =============================================
# Configurações do Banco de Dados (MySQL)
# =============================================
spring.datasource.url=jdbc:mysql://localhost:3306/todoapi?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=39094519

# =============================================
# Configurações do JPA / Hibernate
# =============================================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate

# =============================================
# Configurações do Flyway (migrations)
# =============================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# =============================================
# JWT
# =============================================
api.security.token.secret=${JWT_SECRET:39094519gui-chave-secreta-padrao-para-testes-locais}